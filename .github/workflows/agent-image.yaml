# Образ агента ghcr.io/<owner>/jenkins-agent-python:1 — собирается при изменении agent/ или вручную.
name: agent-image

on:
  push:
    branches: [main]
    paths: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Имя образа (ghcr требует нижний регистр)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jenkins-agent-python:1" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.img.outputs.ref }}
